
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>AFTERHOURS — A KALYUG ORIGINAL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #game { width: 100vw; height: 100dvh; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101418);
    scene.fog = new THREE.Fog(0x101418, 30, 180);

    const camera = new THREE.PerspectiveCamera(
      65, innerWidth / innerHeight, 0.1, 500
    );
    camera.position.set(0, 5, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    document.getElementById('game').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2));

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 300),
      new THREE.MeshStandardMaterial({ color: 0x292929 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.z = -100;
    scene.add(road);

    const car = new THREE.Group();

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.65, 4),
      new THREE.MeshStandardMaterial({
        color: 0x252525, metalness: 0.8, roughness: 0.25
      })
    );
    body.position.y = 0.85;
    car.add(body);

    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.65, 1.8),
      new THREE.MeshStandardMaterial({
        color: 0x151c22, metalness: 0.6, roughness: 0.2
      })
    );
    cabin.position.set(0, 1.42, -0.25);
    car.add(cabin);

    for (const x of [-1.05, 1.05]) {
      for (const z of [-1.3, 1.3]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.42, 0.42, 0.28, 24),
          new THREE.MeshStandardMaterial({ color: 0x090909 })
        );
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, 0.45, z);
        car.add(wheel);
      }
    }

    car.position.set(0, 0, 3);
    scene.add(car);

    camera.lookAt(car.position);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
