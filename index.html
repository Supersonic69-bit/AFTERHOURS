
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050505">

  <title>AFTERHOURS | A KALYUG ORIGINAL</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #game {
      width: 100vw;
      height: 100dvh;
      position: fixed;
      inset: 0;
    }

    #game canvas {
      display: block;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #050505;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      transition: opacity 1s;
    }

    .kalyug {
      color: #b7ff00;
      font-size: clamp(42px, 12vw, 75px);
      font-weight: 900;
      letter-spacing: -4px;
      text-shadow: 0 0 25px #b7ff0055;
      margin-bottom: 35px;
    }

    .tagline {
      font-size: clamp(15px, 4vw, 22px);
      letter-spacing: 3px;
      line-height: 1.6;
      font-weight: 800;
      max-width: 340px;
    }

    .game-title {
      margin-top: 45px;
      font-size: clamp(32px, 9vw, 55px);
      font-weight: 900;
      letter-spacing: 5px;
    }

    #start {
      margin-top: 55px;
      background: #b7ff00;
      color: #080808;
      border: none;
      padding: 17px 42px;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 13px;
      cursor: pointer;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      color: #777;
      font-size: 10px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <div id="intro">
    <div class="kalyug">कलयुग</div>

    <div class="tagline">
      ONLY GOD CAN BE<br>
      THE GODFATHER.
    </div>

    <div class="game-title">AFTERHOURS</div>

    <button id="start">START ENGINE</button>

    <div class="footer">A KALYUG ORIGINAL</div>
  </div>

  <script type="module" src="./src/game.js"></script>

  <script>
    document.getElementById("start").addEventListener("click", () => {
      const intro = document.getElementById("intro");
      intro.style.opacity = "0";

      setTimeout(() => {
        intro.style.display = "none";
      }, 1000);
    });
  </script>

</body>
</html>
